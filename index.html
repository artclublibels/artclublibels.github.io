<!DOCTYPE html>
<html lang="id">


<head>
    <!-- link -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Club Libels</title>

<!-- body -->
<body id="top">
    <!-- nav -->
    <nav>
        <section class="nav">
            <img class="navLogo" src="img/LogoH.png">
        </section>
    </nav>
    <!-- nav end -->
    
    <!-- header -->
    <header id="headerContent">

        <!-- header main contents -->
        <section id="mainHeader">
                <!-- header title -->
            <div id="headTitle">
                <h1><span class="blueHL">Ar</span>t <span class="blueHL">C</span>lub <span class="blueHL">L</span>ibels</h1>
                <h4 id="headSubtitle" class="blueHL">ARCL</h4>
            </div>

            
        </section>
    </header>
    <!-- header end -->




    <!-- section 1: mascot intro-->
    <section id="cardWrapper">
        <div class="card">
            <div class="avatar">
                <div class="avatarFrame">
                    <img src="img/logo.png" alt="Arcle">
                </div>
                <span class="badge">Character</span>
            </div>

                <div class="info">
                    <div class="charName">Arcle</div>
                    <div class="charTitle">Maskot ARCL</div>
                    <div class="divider"></div>
                    <p class="charDesc">
                    Siap menemani di kala artblock~
                    </p>
                    <div class="tags">
                        <span class="tag red">Art</span>
                        <span class="tag blue">Club</span>
                        <span class="tag amber">Libels</span>
                    </div>
                </div>
        </div>
    </section>

        
    <!-- section 1 end -->

    <!-- section 2 -->
    <section class="section2">
        <p>Lorem ipsum dolor sit amet</p>
    </section>
    <!-- section 2 end -->

<!-- body end -->



</html>
